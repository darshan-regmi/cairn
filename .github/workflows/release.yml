name: Release image

# Builds the self-host image for both architectures and pushes it to the
# GitHub Container Registry (GHCR). Runs only on version tags, e.g.
#
#   git tag v0.3.1 && git push origin v0.3.1
#
# Nothing about the registry is hardcoded: the image path comes from the
# repository and the credentials come from the workflow's own GITHUB_TOKEN.
# To publish to Docker Hub instead, swap the `registry`/`username` values in
# the login step for `docker.io` and a `DOCKERHUB_USERNAME`/`DOCKERHUB_TOKEN`
# secret pair.

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase names, and GitHub repositories may contain them.
      - id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
