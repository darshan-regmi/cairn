# Project name is pinned so `docker compose` keeps tracking the running
# container after the repo folder was renamed to `cairn`. The database name,
# user and volume are intentionally left as-is to preserve existing data.
name: fyp-planner

services:
  db:
    image: postgres:16-alpine
    container_name: fyp-planner-postgres
    ports:
      # Host 5433 because 5432 is often taken by other local projects.
      - "5433:5432"
    environment:
      POSTGRES_USER: fyp
      POSTGRES_PASSWORD: fyp
      POSTGRES_DB: fyp_planner
    volumes:
      - fyp-planner-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fyp -d fyp_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fyp-planner-data: