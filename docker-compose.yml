# Compose project name. Pinned so the stack keeps a stable identity even if the
# checkout folder is renamed.
name: cairn

services:
  db:
    image: postgres:16-alpine
    container_name: cairn-postgres
    ports:
      # Host 5433 because 5432 is often taken by other local projects.
      - "5433:5432"
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
    volumes:
      - cairn-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cairn-data: